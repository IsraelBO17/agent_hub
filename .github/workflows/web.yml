# The web app's done gate (web standard §25): `make check`, then the browser suite in mock mode, in web/.
# Runs when the web app, the contract or design file it reads, or this workflow changes.
name: web
on:
  pull_request:
    paths: ["web/**", "api/openapi.yaml", "design/fleet_dev.pen", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", "api/openapi.yaml", "design/fleet_dev.pen", ".github/workflows/web.yml"]
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      # Third-party actions pinned by commit SHA, version in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: make check
      - run: npx playwright install --with-deps chromium
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/artifacts/
          retention-days: 7
