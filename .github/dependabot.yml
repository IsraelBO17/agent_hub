# API standard §15: weekly updates for the API's Python (uv) and Docker image, and for GitHub Actions.
version: 2
updates:
  - package-ecosystem: uv
    directory: /api
    schedule: {interval: weekly}
    groups:
      python: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: /api
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
