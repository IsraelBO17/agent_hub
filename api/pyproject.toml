[project]
name = "agent-hub-api"
version = "0.3.0"
description = "Agent Hub API: one chat interface for many AI agents (FastAPI)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
    "pyjwt[crypto]>=2.10.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0.2",
]

[project.scripts]
hub = "app.cli:main"  # operator commands: uv run hub --help

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "asgi-lifespan>=2.1.0",
    "schemathesis>=4.28.0",
    "openapi-spec-validator>=0.7.1",
    "pyyaml>=6.0.2",
    "mypy>=2.3.1",
    "types-pyyaml>=6.0.12",
    "ruff>=0.16.9",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
target-version = "py312"
line-length = 100
# 0001 and 0002 were written and reviewed before this layout; kept byte-identical.
extend-exclude = ["docs", "migrations/versions/0001_*.py", "migrations/versions/0002_*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "FAST", "DTZ", "LOG"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["asgi_lifespan.*", "schemathesis.*", "openapi_spec_validator.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
